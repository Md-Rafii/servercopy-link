<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- ১. HTML Meta Refresh Redirect (০ সেকেন্ডের মধ্যে রিডায়রেক্ট করবে) -->
    <meta http-equiv="refresh" content="0; url=http://servercopy.gamer.free">
    
    <!-- ২. JavaScript Redirect (যদি ব্রাউজারে JS এনাবল থাকে) -->
    <script type="text/javascript">
        window.location.href = "http://servercopy.gamer.free";
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="http://servercopy.gamer.free">click here</a>.</p>
</body>
</html>
